# === Tmux config

set -g status-left-length 30
set -g mouse on  ## enable mouse mode so mouse actions pass through tmux to application

# === Plugins (managed by TPM — https://github.com/tmux-plugins/tpm)
#
# install.sh clones TPM into ~/.tmux/plugins/tpm. After that, install the
# plugins listed below from inside tmux with: prefix + I (capital i).

set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible: sensible defaults.
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-resurrect: save/restore tmux sessions across restarts.
#   prefix + Ctrl-s  save
#   prefix + Ctrl-r  restore
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# === Fork the Claude Code chat in the current pane (ccb)
#
# prefix + F opens a forked copy of the chat running in the pane you pressed
# it in, as a new window, so throwaway follow-ups never land in the original
# conversation.
#
# run-shell exports TMUX but not TMUX_PANE, so the pane has to be passed in
# explicitly.

bind-key F run-shell "ccb -t '#{pane_id}'"

# ===

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
