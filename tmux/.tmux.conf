# === Tmux config

set -g status-left-length 30

# === Plugins (managed by TPM — https://github.com/tmux-plugins/tpm)
#
# install.sh clones TPM into ~/.tmux/plugins/tpm. After that, install the
# plugins listed below from inside tmux with: prefix + I (capital i).

set -g @plugin 'tmux-plugins/tpm'

# tmux-sensible: sensible defaults.
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-resurrect: save/restore tmux sessions across restarts.
#   prefix + Ctrl-s  save
#   prefix + Ctrl-r  restore
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# ===

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'