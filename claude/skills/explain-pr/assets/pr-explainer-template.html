<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>${page_title}</title>
  <style>
    :root {
      --bg: #f7f8f8;
      --surface: #ffffff;
      --surface-soft: #f0f4f5;
      --text: #172126;
      --text-secondary: #58676f;
      --border: #d8e0e3;
      --accent: #0e7490;
      --accent-soft: #e3f4f7;
      --green: #237a4b;
      --green-soft: #e9f6ee;
      --amber: #a55b08;
      --amber-soft: #fff4dc;
      --red: #b42318;
      --red-soft: #fff0ee;
      --violet: #6d4aff;
      --violet-soft: #f0edff;
      --code-bg: #111a1f;
      --code-text: #e9f1f4;
      --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.65;
      letter-spacing: 0;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: #075e75; }
    code, pre { font-family: var(--mono); }
    code {
      overflow-wrap: anywhere;
      font-size: 0.9em;
    }

    .page-shell {
      width: min(1220px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }
    .page-header {
      max-width: 980px;
      padding: 24px 0 42px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    h1, h2, h3 { line-height: 1.2; letter-spacing: 0; }
    h1 {
      max-width: 900px;
      margin: 12px 0 14px;
      overflow-wrap: anywhere;
      font-size: 3rem;
      font-weight: 760;
    }
    h2 { margin: 0; font-size: 1.7rem; }
    h3 { margin: 26px 0 8px; font-size: 1.08rem; }
    p { margin: 0 0 15px; }
    .subtitle {
      max-width: 760px;
      margin-bottom: 22px;
      color: var(--text-secondary);
      font-size: 1.06rem;
    }
    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
    }
    .meta-strip span, .meta-strip a {
      min-height: 30px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }
    .meta-strip a { color: var(--accent); }

    .document-grid {
      display: grid;
      grid-template-columns: minmax(170px, 230px) minmax(0, 1fr);
      gap: 52px;
      align-items: start;
      margin-top: 34px;
    }
    .toc {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding-right: 16px;
    }
    .toc-title {
      margin-bottom: 10px;
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .toc a {
      padding: 7px 0 7px 12px;
      border-left: 2px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.83rem;
      line-height: 1.3;
      text-decoration: none;
    }
    .toc a:hover {
      border-left-color: var(--accent);
      color: var(--text);
    }
    main { min-width: 0; max-width: 880px; }
    .content-section {
      scroll-margin-top: 24px;
      padding: 46px 0;
      border-bottom: 1px solid var(--border);
    }
    .content-section:first-child { padding-top: 12px; }
    .section-heading {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      margin-bottom: 24px;
    }
    .section-heading p {
      margin: 5px 0 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .section-number {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 800;
    }
    .summary-lead {
      margin-bottom: 28px;
      padding: 20px 22px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      font-size: 1.08rem;
    }
    .summary-lead p:last-child { margin-bottom: 0; }
    .scope-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin-top: 28px;
    }
    .scope-block {
      padding-top: 12px;
      border-top: 3px solid var(--border);
    }
    .scope-block h3 { margin-top: 0; }
    ul { margin: 8px 0; padding-left: 22px; }
    li { margin: 7px 0; }
    .muted { color: var(--text-secondary); }

    .flow-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: none;
    }
    .flow-step {
      position: relative;
      min-height: 166px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .flow-label {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .flow-step p { font-size: 0.9rem; line-height: 1.5; }
    .source-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 12px 0 4px;
    }
    .source-links a {
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
    }

    .heading-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .confidence, .category {
      display: inline-flex;
      min-height: 25px;
      align-items: center;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .confidence.fact, .category.core { background: var(--green-soft); color: var(--green); }
    .confidence.inference, .category.supporting { background: var(--amber-soft); color: var(--amber); }
    .confidence.unknown, .category.generated { background: var(--red-soft); color: var(--red); }
    .category.test { background: var(--violet-soft); color: var(--violet); }
    .category.mechanical { background: var(--surface-soft); color: var(--text-secondary); }
    .chapter-steps {
      margin-top: 26px;
      border-left: 2px solid var(--border);
    }
    .chapter-step {
      position: relative;
      padding: 4px 0 28px 26px;
    }
    .chapter-step::before {
      position: absolute;
      top: 8px;
      left: -6px;
      width: 10px;
      height: 10px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }
    .chapter-step:last-child { padding-bottom: 4px; }
    .chapter-step h3 { margin-top: 0; }
    .code-figure {
      margin: 20px 0 4px;
      overflow: hidden;
      border: 1px solid #26353d;
      border-radius: 8px;
      background: var(--code-bg);
    }
    .code-figure figcaption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      border-bottom: 1px solid #32454f;
      color: #b9c8ce;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .code-figure figcaption a { color: #75d5ee; }
    pre {
      max-width: 100%;
      margin: 0;
      overflow-x: auto;
      padding: 17px;
      color: var(--code-text);
      font-size: 0.78rem;
      line-height: 1.55;
      tab-size: 2;
    }
    pre code { overflow-wrap: normal; }

    .table-wrap {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    th {
      background: var(--surface-soft);
      color: var(--text-secondary);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    tbody tr:last-child td { border-bottom: 0; }
    .coverage-table { min-width: 900px; }
    .coverage-table td:first-child { max-width: 330px; }
    .empty-state {
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-secondary);
    }
    .watchout-list {
      display: grid;
      gap: 14px;
    }
    .watchout {
      padding: 18px 20px;
      border-left: 4px solid var(--border);
      background: var(--surface);
    }
    .watchout.risk { border-left-color: var(--red); }
    .watchout.assumption { border-left-color: var(--amber); }
    .watchout.unknown { border-left-color: var(--accent); }
    .watchout h3 { margin: 4px 0 8px; }
    .watchout-kind {
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    footer {
      max-width: 880px;
      margin-left: calc(230px + 52px);
      padding: 28px 0 0;
      color: var(--text-secondary);
      font-size: 0.76rem;
      overflow-wrap: anywhere;
    }

    @media (max-width: 820px) {
      .page-shell { width: min(100% - 28px, 760px); padding-top: 24px; }
      .document-grid { display: block; margin-top: 22px; }
      .toc {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-height: none;
        margin-bottom: 26px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .toc-title { grid-column: 1 / -1; }
      .toc a { border-left: 0; padding: 6px 4px; }
      footer { margin-left: 0; }
    }

    @media (max-width: 560px) {
      body { font-size: 16px; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.4rem; }
      .page-header { padding-bottom: 28px; }
      .meta-strip { align-items: stretch; }
      .meta-strip span, .meta-strip a { display: inline-flex; align-items: center; }
      .toc { grid-template-columns: 1fr; }
      .section-heading { grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
      .section-number { width: 30px; height: 30px; }
      .scope-grid { grid-template-columns: 1fr; gap: 14px; }
      .flow-list { grid-template-columns: 1fr; }
      .flow-step { min-height: 0; }
      .chapter-step { padding-left: 20px; }
      .code-figure figcaption { flex-direction: column; gap: 4px; }
      th, td { padding: 10px; }
    }

    @media print {
      body { background: white; }
      .page-shell { width: 100%; padding: 0; }
      .document-grid { display: block; }
      .toc { display: none; }
      .content-section { break-inside: avoid; }
      footer { margin-left: 0; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    ${header}
    <div class="document-grid">
      ${toc}
      <main>${main}</main>
    </div>
    ${footer}
  </div>
</body>
</html>
